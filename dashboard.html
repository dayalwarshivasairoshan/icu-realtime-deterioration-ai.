<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Real-Time Deterioration Monitor (IBM LinuxONE demo)</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#0b1f3a;--mut:#5a667a;--line:#dde3ee;--blue:#0f62ff;--red:#da1e28;--amb:#f1a100;--grn:#198038}
@media(prefers-color-scheme:dark){:root{--bg:#10151f;--card:#1a2230;--text:#e8edf6;--mut:#9aa7bd;--line:#2c374a}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
header{padding:16px 24px;background:#0b1f3a;color:#fff}header h1{margin:0;font-size:20px}header p{margin:4px 0 0;color:#bbd0ff;font-size:13px}
main{max-width:1200px;margin:auto;padding:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}

.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:12px;margin-top:12px}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
.p{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px}.p h2{margin:0 0 8px;font-size:15px}
.scroll{max-height:420px;overflow:auto}
.row{display:flex;align-items:center;gap:8px;padding:6px;border-radius:6px;cursor:pointer;font-size:13px}.row:hover,.row.sel{background:var(--line)}
.row .id{width:48px;font-weight:600}.row .tag{width:90px;color:var(--mut)}.row svg{flex:1;height:22px}
.pill{padding:2px 8px;border-radius:99px;font-size:11px;color:#fff}.W{background:var(--amb)}.C{background:var(--red)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:5px;border-bottom:1px solid var(--line)}
small{color:var(--mut)}
